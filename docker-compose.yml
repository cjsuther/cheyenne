services:
  # ─── BASE DE DATOS ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cheyenne-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cheyenne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cheyenne123}
      POSTGRES_DB: ${POSTGRES_DB:-cheyenne}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dbs/init:/docker-entrypoint-initdb.d
    networks:
      - cheyenne-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cheyenne}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── REDIS (para workers async y caché) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cheyenne-redis
    restart: always
    networks:
      - cheyenne-net

  # ─── MÓDULO SEGURIDAD ─────────────────────────────────────────────
  seguridad:
    build:
      context: ./modules
      dockerfile: seguridad/Dockerfile
    container_name: cheyenne-seguridad
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cheyenne-net

  # ─── MÓDULO ADMINISTRACIÓN ────────────────────────────────────────
  administracion:
    build:
      context: ./modules
      dockerfile: administracion/Dockerfile
    container_name: cheyenne-administracion
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      REDIS_URL: redis://redis:6379
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO AUDITORÍA ─────────────────────────────────────────────
  auditoria:
    build:
      context: ./modules
      dockerfile: auditoria/Dockerfile
    container_name: cheyenne-auditoria
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO COMUNICACIÓN ──────────────────────────────────────────
  comunicacion:
    build:
      context: ./modules
      dockerfile: comunicacion/Dockerfile
    container_name: cheyenne-comunicacion
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO PRESUPUESTO ───────────────────────────────────────────
  presupuesto:
    build:
      context: ./modules
      dockerfile: presupuesto/Dockerfile
    container_name: cheyenne-presupuesto
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
      ADMINISTRACION_URL: http://administracion:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO CONTADURÍA (ciclo del gasto) ──────────────────────────
  contaduria:
    build:
      context: ./modules
      dockerfile: contaduria/Dockerfile
    container_name: cheyenne-contaduria
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
      PRESUPUESTO_URL: http://presupuesto:8000
    depends_on:
      - seguridad
      - presupuesto
    networks:
      - cheyenne-net

  # ─── MÓDULO COMPRAS (adquisiciones) ───────────────────────────────
  compras:
    build:
      context: ./modules
      dockerfile: compras/Dockerfile
    container_name: cheyenne-compras
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO CONTABILIDAD ──────────────────────────────────────────
  contabilidad:
    build:
      context: ./modules
      dockerfile: contabilidad/Dockerfile
    container_name: cheyenne-contabilidad
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO CEMENTERIO ────────────────────────────────────────────
  cementerio:
    build:
      context: ./modules
      dockerfile: cementerio/Dockerfile
    container_name: cheyenne-cementerio
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net
  apremios:
    build:
      context: ./modules
      dockerfile: apremios/Dockerfile
    container_name: cheyenne-apremios
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
      INGRESOS_PUBLICOS_URL: http://ingresos_publicos:8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - seguridad
    networks:
      - cheyenne-net
  # ─── MÓDULO REPORTES ──────────────────────────────────────────────
  reportes:
    build:
      context: ./modules
      dockerfile: reportes/Dockerfile
    container_name: cheyenne-reportes
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
      TESORERIA_URL: http://tesoreria:8000
      EMISIONES_URL: http://emisiones:8000
      CONTADURIA_URL: http://contaduria:8000
      PRESUPUESTO_URL: http://presupuesto:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO IMPORTACIÓN ───────────────────────────────────────────
  importacion:
    build:
      context: ./modules
      dockerfile: importacion/Dockerfile
    container_name: cheyenne-importacion
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO INGRESOS PÚBLICOS ─────────────────────────────────────
  ingresos_publicos:
    build:
      context: ./modules
      dockerfile: ingresos_publicos/Dockerfile
    container_name: cheyenne-ingresos-publicos
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO INTERFACE ─────────────────────────────────────────────
  interface:
    build:
      context: ./modules
      dockerfile: interface/Dockerfile
    container_name: cheyenne-interface
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO TESORERÍA ─────────────────────────────────────────────
  tesoreria:
    build:
      context: ./modules
      dockerfile: tesoreria/Dockerfile
    container_name: cheyenne-tesoreria
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
      REDIS_URL: redis://redis:6379
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── MÓDULO EMISIONES ────────────────────────────────────────────
  emisiones:
    build:
      context: ./modules
      dockerfile: emisiones/Dockerfile
    container_name: cheyenne-emisiones
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
      REDIS_URL: redis://redis:6379
      PDF_OUTPUT_DIR: /app/pdfs
    depends_on:
      - seguridad
    volumes:
      - emisiones_pdfs:/app/pdfs
    networks:
      - cheyenne-net

  # ─── MÓDULO WAV (Workflow/Aprobaciones) ───────────────────────────
  wav:
    build:
      context: ./modules
      dockerfile: wav/Dockerfile
    container_name: cheyenne-wav
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheyenne}:${POSTGRES_PASSWORD:-cheyenne123}@postgres:5432/${POSTGRES_DB:-cheyenne}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      SEGURIDAD_URL: http://seguridad:8000
    depends_on:
      - seguridad
    networks:
      - cheyenne-net

  # ─── FRONTEND ─────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: cheyenne-frontend
    restart: always
    networks:
      - cheyenne-net

  # ─── NGINX (reverse proxy) ────────────────────────────────────────
  nginx:
    build: ./nginx
    container_name: cheyenne-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - seguridad
      - administracion
      - auditoria
      - comunicacion
      - importacion
      - ingresos_publicos
      - tesoreria
      - emisiones
      - presupuesto
      - contaduria
      - compras
      - contabilidad
      - cementerio
      - apremios
      - reportes
      - wav
    networks:
      - cheyenne-net

volumes:
  postgres_data:
  emisiones_pdfs:

networks:
  cheyenne-net:
    driver: bridge
