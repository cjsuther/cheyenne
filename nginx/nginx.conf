events {
    worker_connections 1024;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server_tokens off;

    upstream frontend         { server frontend:80; }
    upstream seguridad        { server seguridad:8000; }
    upstream administracion   { server administracion:8000; }
    upstream auditoria        { server auditoria:8000; }
    upstream comunicacion     { server comunicacion:8000; }
    upstream importacion      { server importacion:8000; }
    upstream ingresos_publicos { server ingresos_publicos:8000; }
    upstream interface_svc    { server interface:8000; }
    upstream tesoreria        { server tesoreria:8000; }
    upstream emisiones        { server emisiones:8000; }
    upstream presupuesto      { server presupuesto:8000; }
    upstream contaduria       { server contaduria:8000; }
    upstream compras          { server compras:8000; }
    upstream contabilidad     { server contabilidad:8000; }
    upstream cementerio       { server cementerio:8000; }
    upstream apremios         { server apremios:8000; }
    upstream reportes         { server reportes:8000; }
    upstream patrimonio       { server patrimonio:8000; }
    upstream wav              { server wav:8000; }

    # Mapa para CSP: desactivar en /api/docs
    map $uri $csp_header {
        "~^/api/docs" "";
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data:;";
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Headers de seguridad (CSP condicional via map)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_header always;

        # ── Swagger UI unificado ────────────────────────────────────
        location = /api/docs {
            root /usr/share/nginx/html;
            try_files /swagger.html =404;
        }

        # ── Auth (rate limited) ──────────────────────────────────────
        location /api/seguridad/auth/token {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://seguridad/auth/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── API routes ───────────────────────────────────────────────
        location /api/seguridad/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://seguridad/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/administracion/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://administracion/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auditoria/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auditoria/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/comunicacion/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://comunicacion/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/importacion/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://importacion/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ingresos-publicos/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ingresos_publicos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/interface/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://interface_svc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/tesoreria/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://tesoreria/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/emisiones/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://emisiones/;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }




        location /api/compras/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://compras/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/contabilidad/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://contabilidad/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/cementerio/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://cementerio/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/apremios/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://apremios/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/reportes/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://reportes/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/patrimonio/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://patrimonio/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


        location /api/contaduria/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://contaduria/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/presupuesto/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://presupuesto/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/wav/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://wav/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Health checks ────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Frontend (todo lo demás va al SPA) ───────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
