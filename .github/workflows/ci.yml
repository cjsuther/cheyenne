name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (compile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gate duro: todos los módulos deben compilar (sintaxis / imports básicos)
      - name: Compilar todos los módulos
        run: |
          python -m py_compile $(find modules -name "*.py" -not -path "*/__pycache__/*")

      # Gate duro: tests de lógica de negocio (SQLite en memoria, verificados en verde).
      - name: Tests de negocio (gate)
        run: |
          pip install pytest "sqlalchemy>=2" pydantic pydantic-settings fastapi httpx python-jose passlib psycopg2-binary
          for m in contabilidad presupuesto tesoreria; do
            echo "== pytest $m =="
            ( cd "modules/$m" && python -m pytest tests -q )
          done

      # Best-effort: motor de cálculo (emisiones / ingresos).
      - name: Tests motor de cálculo (best-effort)
        continue-on-error: true
        run: |
          for m in emisiones ingresos_publicos; do
            if [ -d "modules/$m/tests" ]; then
              echo "== pytest $m =="
              pip install -r "modules/$m/requirements.txt" >/dev/null 2>&1 || true
              ( cd "modules/$m" && PYTHONPATH="$PWD:$PWD/../.." python -m pytest tests -q ) || true
            fi
          done

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar y compilar
        run: |
          cd frontend
          npm ci
          npm run build

  migrations:
    name: Migraciones (orden + sintaxis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Verifica que la numeración de migraciones sea consecutiva y sin huecos
      - name: Verificar numeración
        run: |
          nums=$(ls migrations/[0-9]*.sql | sed -E 's#.*/([0-9]+)_.*#\1#' | sort)
          i=1
          for n in $nums; do
            printf -v exp "%03d" "$i"
            if [ "$n" != "$exp" ]; then echo "Hueco/desorden en migraciones: esperaba $exp, encontré $n"; exit 1; fi
            i=$((i+1))
          done
          echo "Migraciones consecutivas OK ($((i-1)) archivos)"
